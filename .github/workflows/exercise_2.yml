name: Test Exercise 2
on: push
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the code
        uses: actions/checkout@v3
      - name: Install dependencies
        run: npm ci
      # Run lint
      - name: Run Lint
        run: npm run lint
  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the code
        uses: actions/checkout@v3
      - name: Install dependencies
        run: npm ci
      # Run tests
      - name: Run tests
        run: npm run test
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the code
        uses: actions/checkout@v3
      - name: Install dependencies
        run: npm ci  
      # Run build
      - name: Run build
        run: npm run build
  deploy:
    needs: build 
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the code
        uses: actions/checkout@v3
      - name: Install dependencies
        run: npm ci 
      - name: deploy the code
        run: echo "Deploying"     



